# Hot-reloaded upstream — rewritten by deploy/run-local.sh during every
# blue/green swap. The `server` line names a Docker container by hostname
# (resolved via Docker's embedded DNS on the sbox-net network), and the
# port is the internal port the JVM listens on inside that container.
#
# DO NOT hand-edit during a deploy — the script will overwrite this file.
upstream sbox_upstream {
    server sbox-app:8082 max_fails=1 fail_timeout=2s;
}
