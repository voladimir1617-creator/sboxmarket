# nginx edge config for the sbox-edge container (the front-door that
# Cloudflare tunnel hits on host :8082). The upstream points at
# whichever app container is currently active — see edge-upstream.conf,
# which run-local.sh rewrites + reloads to swap blue/green.
#
# Reload semantics: `nginx -s reload` re-reads config without dropping
# in-flight connections. Old worker keeps serving its open requests;
# new worker serves new requests against the new upstream. That is the
# zero-downtime guarantee.
#
# This config runs INSIDE the sbox-edge container. The app upstream is
# resolved by Docker's embedded DNS against the sbox-net network, so
# the upstream block only needs the container name + internal port.

worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 2m;

    # ------------------------------------------------------------------
    # gzip — added 2026-05-03 perf audit. design.css is 3.37 MB raw and
    # was shipping uncompressed from nginx (Cloudflare was masking it
    # with its own edge gzip). Enabling here means:
    #   1. nginx -> Cloudflare bandwidth drops ~85% on text assets
    #   2. any non-CF probe (direct localhost:8082, monitoring) gets
    #      compressed responses too
    # gzip_comp_level 5 is the sweet spot — level 6 is the upstream
    # default but adds CPU for ~1% size win on already-compressed JS.
    # gzip_min_length 1024 skips tiny responses where the gzip header
    # overhead exceeds the savings (e.g. /api/health json).
    # gzip_proxied any so we compress even when there's a Via: header
    # from cloudflared.
    # gzip_vary on adds `Vary: Accept-Encoding` so caches handle both
    # encoded + identity correctly.
    # ------------------------------------------------------------------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    # NB: text/html is omitted — `gzip on` already gzips text/html by
    # default, and listing it again triggers a duplicate-MIME warning
    # at config-test time.
    gzip_types text/css
               text/plain
               text/javascript
               application/javascript
               application/json
               application/xml
               application/xml+rss
               application/rss+xml
               application/atom+xml
               image/svg+xml
               application/manifest+json
               application/x-web-app-manifest+json
               font/ttf
               font/otf;

    # Hot-reloadable upstream — rewritten by run-local.sh on every deploy.
    include /etc/nginx/conf.d/edge-upstream.conf;

    server {
        listen 8082 default_server;
        server_name _;

        # Health probe for the edge itself (not the app). cloudflared
        # pings the upstream URL; this short-circuits without forwarding.
        location = /__edge_health {
            return 200 "edge-ok\n";
            add_header Content-Type text/plain;
        }

        # Health + readiness — never logged, never cached at the edge.
        # Tomcat 400s on a missing/unparseable Host header, so propagate
        # the upstream-facing $host the same as the catch-all `location /`.
        location = /api/health   { proxy_pass http://sbox_upstream; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; access_log off; add_header Cache-Control "no-store" always; }
        location = /api/health/  { proxy_pass http://sbox_upstream; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; access_log off; add_header Cache-Control "no-store" always; }
        location = /api/ready    { proxy_pass http://sbox_upstream; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; access_log off; add_header Cache-Control "no-store" always; }
        location = /api/ready/   { proxy_pass http://sbox_upstream; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; access_log off; add_header Cache-Control "no-store" always; }

        # ------------------------------------------------------------------
        # Static assets — added 2026-05-03 perf audit.
        # The app serves /css/, /js/, /img/, /font/ from Spring Boot's
        # static resource handler, which slaps `Cache-Control: no-cache,
        # must-revalidate` on everything (Spring's safety default). For
        # public, non-fingerprinted static assets that's wasteful — the
        # operator deploys via `docker build && run-local.sh`, which
        # produces a new image with a fresh `Last-Modified` on every CSS
        # edit. So conditional GETs return 304 anyway; the question is
        # how often the browser bothers to ask.
        #
        # CHOICE: 5-minute browser cache + revalidate.
        #   - The operator iterates aggressively (per perf-audit brief);
        #     a 1-year immutable cache would force every iteration to
        #     ship under a new URL, which the app does NOT do. Filenames
        #     like /css/design.css are pinned in index.html.
        #   - 5min max-age means the browser hits cache for 5min, then
        #     issues a conditional GET. nginx replies 304 if Last-Modified
        #     hasn't moved (cheap) — so most revalidations are 0-byte.
        #   - Cloudflare in front honours s-maxage if we set one; we
        #     leave its own cache rules as-is (cf-cache-status:
        #     REVALIDATED is what we observed) and let CF use the
        #     Cache-Control we emit.
        # We override the upstream Cache-Control with `add_header ...
        # always` (note: also clear the existing one — `add_header`
        # appends, so we use `proxy_hide_header` to drop the upstream
        # value first).
        # ------------------------------------------------------------------
        location ~* ^/(css|js|img|font)/ {
            proxy_pass         http://sbox_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_read_timeout 60s;
            proxy_connect_timeout 5s;
            proxy_next_upstream error timeout http_502 http_503 http_504;

            # Drop Spring Boot's `no-cache, must-revalidate` and replace
            # with a 5-minute browser cache. Conditional GETs revalidate
            # via Last-Modified -> 304 — nginx handles this automatically
            # on proxied responses when the upstream sends Last-Modified.
            proxy_hide_header  Cache-Control;
            add_header         Cache-Control "public, max-age=300, must-revalidate" always;
            # Note: Spring Boot also emits Set-Cookie: sbox_csrf=... on
            # every response (even static asset GETs), which technically
            # blocks shared/CDN caching. We DO NOT strip it here — the
            # CSRF cookie is on the request path and the cookie-state
            # gate has not been exercised against a stripped response.
            # Cloudflare-side (cf-cache-status: REVALIDATED on observed
            # responses) handles its own cache rules, and that's good
            # enough for the headline win.
        }

        # Everything else — proxy to whichever container is currently
        # in the upstream block.
        location / {
            proxy_pass         http://sbox_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_read_timeout 60s;
            proxy_connect_timeout 5s;
            # During the few-second swap window, retry on the next
            # upstream entry if a connection is refused / a 502 is
            # produced. With a single upstream this is a no-op, but
            # if a deploy transiently leaves both blue + green up
            # this keeps requests flowing.
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }
}
