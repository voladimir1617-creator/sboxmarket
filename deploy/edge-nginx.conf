# nginx edge config for the sbox-edge container (the front-door that
# Cloudflare tunnel hits on host :8082). The upstream points at
# whichever app container is currently active — see edge-upstream.conf,
# which run-local.sh rewrites + reloads to swap blue/green.
#
# Reload semantics: `nginx -s reload` re-reads config without dropping
# in-flight connections. Old worker keeps serving its open requests;
# new worker serves new requests against the new upstream. That is the
# zero-downtime guarantee.
#
# This config runs INSIDE the sbox-edge container. The app upstream is
# resolved by Docker's embedded DNS against the sbox-net network, so
# the upstream block only needs the container name + internal port.

worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 2m;

    # Hot-reloadable upstream — rewritten by run-local.sh on every deploy.
    include /etc/nginx/conf.d/edge-upstream.conf;

    server {
        listen 8082 default_server;
        server_name _;

        # Health probe for the edge itself (not the app). cloudflared
        # pings the upstream URL; this short-circuits without forwarding.
        location = /__edge_health {
            return 200 "edge-ok\n";
            add_header Content-Type text/plain;
        }

        # Health + readiness — never logged, never cached at the edge.
        location = /api/health   { proxy_pass http://sbox_upstream; access_log off; add_header Cache-Control "no-store" always; }
        location = /api/health/  { proxy_pass http://sbox_upstream; access_log off; add_header Cache-Control "no-store" always; }
        location = /api/ready    { proxy_pass http://sbox_upstream; access_log off; add_header Cache-Control "no-store" always; }
        location = /api/ready/   { proxy_pass http://sbox_upstream; access_log off; add_header Cache-Control "no-store" always; }

        # Everything else — proxy to whichever container is currently
        # in the upstream block.
        location / {
            proxy_pass         http://sbox_upstream;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_read_timeout 60s;
            proxy_connect_timeout 5s;
            # During the few-second swap window, retry on the next
            # upstream entry if a connection is refused / a 502 is
            # produced. With a single upstream this is a no-op, but
            # if a deploy transiently leaves both blue + green up
            # this keeps requests flowing.
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }
}
