<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Status — SkinBox</title>
  <meta name="description" content="Live health check for the SkinBox marketplace — API, database, auction engine, and marketplace endpoints.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SkinBox">
  <meta property="og:title" content="System Status · SkinBox">
  <meta property="og:description" content="Live health of every core SkinBox service — API, database, marketplace, auctions. Auto-refreshes every 30 seconds.">
  <meta property="og:image" content="/img/favicon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="System Status · SkinBox">
  <meta name="twitter:description" content="Live health of every core SkinBox service — API, database, marketplace, auctions.">
  <link rel="canonical" href="https://skinbox.market/status.html">
  <meta name="theme-color" content="#1ea5ff">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/svg+xml" href="/img/logo.svg">
  <link rel="icon" type="image/png" href="/img/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/design.css">
  <style>
    .status-page { max-width: 820px; margin: 40px auto 80px; padding: 0 24px; color: var(--text-primary); }
    .status-hero { text-align: center; padding: 40px 24px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 24px; }
    .status-dot  { display: inline-block; width: 14px; height: 14px; border-radius: 50%; margin-right: 10px; vertical-align: middle; }
    .status-dot.up   { background: #22c55e; box-shadow: 0 0 0 4px rgba(34,197,94,0.2); }
    .status-dot.warn { background: #fbbf24; box-shadow: 0 0 0 4px rgba(251,191,36,0.2); }
    .status-dot.down { background: #f87171; box-shadow: 0 0 0 4px rgba(248,113,113,0.2); }
    .status-headline { font-size: 24px; font-weight: 800; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; }
    .status-sub      { font-size: 14px; color: var(--text-secondary); }
    .status-grid  { display: grid; gap: 10px; }
    .status-row   { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; }
    .status-row-name { font-weight: 700; font-size: 14px; }
    .status-row-sub  { font-size: 11px; color: var(--text-muted); margin-top: 2px; font-family: 'JetBrains Mono', monospace; }
    .status-row-badge { font-size: 11px; padding: 4px 10px; border-radius: 4px; font-weight: 800; letter-spacing: 0.5px; }
    .status-row-badge.up   { background: rgba(34,197,94,0.15);  color: #22c55e; }
    .status-row-badge.warn { background: rgba(251,191,36,0.15); color: #fbbf24; }
    .status-row-badge.down { background: rgba(248,113,113,0.15); color: #f87171; }
    .status-foot  { margin-top: 30px; text-align: center; font-size: 12px; color: var(--text-muted); }
    .status-back  { display: inline-block; margin-bottom: 24px; color: var(--accent); text-decoration: none; font-size: 13px; }
  </style>
</head>
<body>
  <main class="status-page">
    <a class="status-back" href="/">← Back to SkinBox</a>
    <div class="status-hero" id="hero">
      <div class="status-headline" id="headline">
        <span class="status-dot warn"></span> Checking…
      </div>
      <div class="status-sub" id="sub">Pinging /api/health…</div>
    </div>
    <div class="status-grid" id="grid"></div>
    <div class="status-foot" id="foot">
      Auto-refreshes every 30 seconds. Need help? Email
      <a href="mailto:support@skinbox.market" style="color:var(--accent)">support@skinbox.market</a>
      or <a href="/support" style="color:var(--accent)">open a ticket</a>.
    </div>
    <div class="status-foot" id="version-line" style="opacity:0.55;font-size:11px;margin-top:12px;font-family:JetBrains Mono,monospace;"></div>
  </main>

  <script>
    // Static status page — pings public endpoints and renders a green/amber/red
    // summary the same way any status dashboard does. Zero server-side plumbing:
    // every probe is a vanilla fetch from the client.
    const CHECKS = [
      { id: 'api',       name: 'API',             endpoint: '/api/health',
        sub: 'Core REST API', ok: (r) => r.ok },
      // Batch 689 — add /api/ready so the status page surfaces DB
      // connectivity separately from JVM liveness. /api/health stays
      // green as long as Spring is up; /api/ready goes red when the
      // Postgres pool is unreachable. Two green rows = fully
      // operational; /api/health green + /api/ready red = user-
      // visible degradation.
      { id: 'database-conn', name: 'Database',    endpoint: '/api/ready',
        sub: 'Postgres connection pool · isValid() probe', ok: (r) => r.ok },
      { id: 'market',    name: 'Marketplace',     endpoint: '/api/listings/stats',
        sub: 'Active listings + floor prices', ok: (r) => r.ok },
      { id: 'database',  name: 'Item catalogue',  endpoint: '/api/items?category=Hats',
        sub: 'Item lookups', ok: (r) => r.ok },
      { id: 'auctions',  name: 'Auction engine',  endpoint: '/api/listings/ending-soon',
        sub: 'Bid placement + anti-snipe', ok: (r) => r.ok }
    ];

    async function runChecks() {
      const results = await Promise.all(CHECKS.map(async c => {
        const t0 = performance.now();
        try {
          const r = await fetch(c.endpoint, { credentials: 'same-origin' });
          const ms = Math.round(performance.now() - t0);
          return { ...c, status: c.ok(r) ? 'up' : (r.status >= 500 ? 'down' : 'warn'), httpStatus: r.status, ms };
        } catch (e) {
          return { ...c, status: 'down', httpStatus: 0, ms: Math.round(performance.now() - t0) };
        }
      }));
      render(results);
    }

    function render(results) {
      const anyDown  = results.some(r => r.status === 'down');
      const anyWarn  = results.some(r => r.status === 'warn');
      const overall  = anyDown ? 'down' : anyWarn ? 'warn' : 'up';
      const headline = document.getElementById('headline');
      const sub      = document.getElementById('sub');
      headline.innerHTML =
        '<span class="status-dot ' + overall + '"></span>' +
        (overall === 'up'   ? 'All systems operational' :
         overall === 'warn' ? 'Degraded performance'   :
                              'Partial outage');
      sub.textContent =
        overall === 'up'   ? 'Every probed service is responding normally.' :
        overall === 'warn' ? 'Some services are slower than expected — bids and buys may be queued.' :
                             'One or more services are unreachable. Trades in flight are safe — see below.';

      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      results.forEach(r => {
        const row = document.createElement('div');
        row.className = 'status-row';
        row.innerHTML =
          '<div>' +
            '<div class="status-row-name">' + r.name + '</div>' +
            '<div class="status-row-sub">' + r.sub + ' · ' + r.endpoint + ' · ' + r.ms + 'ms</div>' +
          '</div>' +
          '<div class="status-row-badge ' + r.status + '">' +
            (r.status === 'up' ? 'OPERATIONAL' : r.status === 'warn' ? 'DEGRADED' : 'DOWN') +
          '</div>';
        grid.appendChild(row);
      });
    }

    runChecks();
    setInterval(runChecks, 30_000);

    // Batch 866 — surface the current pod's version + uptime so
    // operators reading this page can tell at a glance "is this the
    // pod that got redeployed 20min ago, or a lingering old replica?"
    // Cached for 10min by the server so this is cheap.
    async function renderVersion() {
      try {
        const r = await fetch('/api/version', { credentials: 'same-origin' });
        if (!r.ok) return;
        const data = await r.json();
        const el = document.getElementById('version-line');
        if (!el) return;
        const bits = [];
        if (data.version) bits.push('v' + data.version);
        if (data.startupAt) {
          const ms = Date.now() - data.startupAt;
          const h  = Math.floor(ms / 3_600_000);
          const m  = Math.floor((ms % 3_600_000) / 60_000);
          const label = h > 0 ? (h + 'h ' + m + 'm') : (m + 'm');
          bits.push('uptime ' + label);
          bits.push('started ' + new Date(data.startupAt).toLocaleString());
        }
        el.textContent = bits.join(' · ');
      } catch (_) { /* silent — version line stays blank */ }
    }
    renderVersion();
    setInterval(renderVersion, 60_000);
  </script>
</body>
</html>
