<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- iOS PWA meta — enables full-screen "Add to Home Screen" mode and
       a black status bar that blends with the dark theme. viewport-fit=cover
       above lets safe-area-inset-* env() values work correctly under the
       notch + home indicator. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SkinBox">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Windows 10/11 pinned-tile configuration (batch 762). When a user
       pins SkinBox to the Start menu, the tile background color matches
       the theme and the icon is the 192px favicon instead of the
       browser's default screenshot-of-the-page fallback. -->
  <meta name="msapplication-TileColor" content="#1ea5ff">
  <meta name="msapplication-TileImage" content="/img/favicon-192.png">
  <title>SkinBox — s&box Skin Marketplace</title>
  <meta name="description" content="The s&box skin marketplace — trade Workshop items, hats, and clothing with full price history and trusted sellers.">
  <meta name="theme-color" content="#1ea5ff">
  <!-- Full favicon set. Browsers pick the closest matching size for the
       tab icon slot (16/32 on standard DPI, 48+ on HiDPI). Giving them
       actual square sources means the crate renders edge-to-edge in the
       tab slot instead of being letterboxed inside the rectangular
       1536×1024 source. favicon.ico is the legacy fallback for older
       Edge/IE and bookmark tiles. -->
  <!-- Batch 1068 — SVG favicon takes priority on modern browsers (Chrome
       80+, Firefox 73+, Safari 17+). Renders the blue-fade isometric
       crate crisply at every DPI / size without needing per-size PNGs.
       The PNG favicons stay as fallbacks for older browsers and Windows
       pinned tiles. -->
  <link rel="icon" type="image/svg+xml" href="/img/logo.svg">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16"  href="/img/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32"  href="/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48"  href="/img/favicon-48.png">
  <link rel="icon" type="image/png" sizes="96x96"  href="/img/favicon-96.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/img/favicon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/img/favicon-192.png">
  <link rel="manifest" href="/manifest.json">
  <!-- OpenSearch descriptor — lets Chrome / Firefox / Edge users add
       SkinBox as a custom search engine. Once added, typing "sbox blue hat"
       in the URL bar searches directly without visiting the site first. -->
  <link rel="search" type="application/opensearchdescription+xml"
        title="SkinBox" href="/opensearch.xml">
  <!-- Batch 783 — canonical URL. Google + other crawlers use this to
       collapse query-param variants (`/?sort=newest&category=Hats`)
       into the single indexable homepage. OpenGraphController rewrites
       this for /item/:id + /stall/:id + /loadout/:id so those deep
       pages get their own canonical rather than all collapsing here. -->
  <link rel="canonical" href="https://skinbox.market/">
  <meta property="og:title" content="SkinBox — s&box Skin Marketplace">
  <meta property="og:description" content="Trade Workshop items and cosmetics with lower fees than Steam. Escrowed trades, Stripe payouts.">
  <meta property="og:image" content="https://skinbox.market/img/favicon-512.png">
  <!-- og:image:width / og:image:height let Facebook + LinkedIn render the
       preview immediately on first share instead of withholding the card
       until they fetch + measure the image themselves. The image is the
       512×512 square logo, so both dimensions are 512. -->
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:image:type" content="image/png">
  <meta property="og:type" content="website">
  <!-- og:url must match <link rel="canonical"> above exactly — both point at
       the homepage. The trailing slash keeps the two in sync so Facebook /
       Discord don't treat the slashless OG URL as a separate object from the
       canonical the rest of the head (and OpenGraphController) emits. -->
  <meta property="og:url" content="https://skinbox.market/">
  <meta property="og:site_name" content="SkinBox">
  <!-- Twitter card type matches the image's aspect ratio. The favicon-512
       source is a 512×512 square; `summary_large_image` expects a 2:1
       landscape banner (1200×628 recommended) and will reject / letterbox
       a square. `summary` correctly renders the square crate alongside
       the title + description. Same treatment as changelog.html +
       status.html which both already use `summary`. -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="SkinBox — s&box Skin Marketplace">
  <meta name="twitter:description" content="Trade Workshop items and cosmetics with lower fees than Steam. Escrowed trades, Stripe payouts.">
  <meta name="twitter:image" content="https://skinbox.market/img/favicon-512.png">
  <meta name="color-scheme" content="dark">
  <meta name="format-detection" content="telephone=no">
  <meta name="robots" content="index, follow">
  <!-- JSON-LD structured data for the marketplace home. Two graphs:
       (1) Organization — gives Google a knowledge-panel anchor (logo,
       name, canonical URL) so brand searches for "SkinBox" resolve to
       this site. (2) WebSite + SearchAction — declares the site's
       internal search endpoint so Google can render a sitelinks
       search box directly in the results page. The `urlTemplate`
       points at /market?q= (the canonical marketplace route, same as
       the OpenSearch descriptor) with `{search_term_string}` as the
       query placeholder. OpenGraphController injects route-specific
       JSON-LD (Product / Store / CreativeWork / FAQPage) on the deep
       pages — this block is the site-wide default the home page ships. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://skinbox.market/#organization",
        "name": "SkinBox",
        "url": "https://skinbox.market/",
        "logo": "https://skinbox.market/img/favicon-512.png",
        "description": "Peer-to-peer marketplace for s&box cosmetic skins — Workshop items, hats, and clothing with escrowed Stripe checkout and 2% fees."
      },
      {
        "@type": "WebSite",
        "@id": "https://skinbox.market/#website",
        "name": "SkinBox",
        "url": "https://skinbox.market/",
        "publisher": { "@id": "https://skinbox.market/#organization" },
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://skinbox.market/market?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    ]
  }
  </script>
  <!-- Google Fonts preconnects removed — all fonts are self-hosted same-origin
       (see /css/fonts.css below). No third-party font host is contacted. -->
  <link rel="dns-prefetch" href="https://unpkg.com">
  <!-- Batch 767 — preconnect to the Steam image CDNs. Every marketplace
       card, stall hero, and item modal pulls at least one image from
       these hosts. Preconnect starts the TCP + TLS handshake in parallel
       with the JS bundle download so the first image render doesn't pay
       a full RTT for the connection setup. -->
  <link rel="preconnect" href="https://steamcommunity-a.akamaihd.net" crossorigin>
  <link rel="preconnect" href="https://avatars.fastly.steamstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://community.cloudflare.steamstatic.com">
  <!-- Typography — SELF-HOSTED Roboto + Roboto Mono (the csfloat-parity font),
       served same-origin from /fonts via /css/fonts.css. Previously loaded from
       the Google Fonts CDN, which (a) silently broke the WHOLE site's sizing,
       line-heights and underline offsets whenever the CDN was slow / blocked /
       offline — it fell back to Arial, whose metrics differ from Roboto — and
       (b) leaks visitor IPs to Google (a GDPR concern). The stale Geist +
       Fraunces CDN request (a dead leftover from the pre-Roboto redesign) was
       dropped entirely. Self-hosted = reliable, fast, private, identical
       everywhere. -->
  <link rel="stylesheet" href="/css/fonts.css">
  <!-- Material Symbols Rounded (the ~80-icon subset, 36KB woff2) is now
       SELF-HOSTED in /css/fonts.css alongside Roboto — same reliability +
       privacy reasons. The woff2 lives in /fonts/material-symbols.woff2. -->
  <!-- Single unified CSS — editorial design system + app adapter in one file.
       Legacy styles.css was deleted after the full redesign (see docs/).
       wave-147: ?v= cache-buster — bump on every CSS change so the Cloudflare
       edge + browsers refetch instead of serving a stale design.css (the
       no-cache header alone wasn't defeating the edge cache, so live users
       kept seeing the pre-parity look). index.html itself is no-store. -->
  <link rel="stylesheet" href="/css/design.css?v=295">
  <!-- Boss QA cycle 12 — inline critical CSS so the first paint on slow 3G
       isn't a UA-default WHITE flash. design.css is ~2MB and on slow
       networks paints 1-3s after first byte; before this block, the
       browser drew the body in default white until the stylesheet
       arrived. Now: dark editorial bg + skeleton chrome paint at first
       byte, design.css then takes over without a visible repaint. */ -->
  <style>
    :root { color-scheme: dark; }
    html, body { background: #1f2228; color: #f3f4f6; margin: 0; min-height: 100%; }
    body { font-family: 'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif; }
    #root { min-height: 100vh; }
    .boot-skel { display: flex; flex-direction: column; min-height: 100vh; }
    .boot-skel-nav { height: 56px; border-bottom: 1px solid #2a2d34; display: flex; align-items: center; padding: 0 24px; gap: 14px; }
    .boot-skel-logo { width: 28px; height: 28px; border-radius: 6px; background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); }
    .boot-skel-brand { width: 70px; height: 14px; border-radius: 3px; background: #2a2d34; }
    .boot-skel-link { width: 60px; height: 12px; border-radius: 3px; background: #2a2d34; margin-left: 18px; }
    .boot-skel-cta { width: 140px; height: 28px; border-radius: 999px; background: linear-gradient(135deg, #2563eb 0%, #1e3a8a 100%); margin-left: auto; }
    .boot-skel-main { flex: 1; padding: 40px 24px; display: grid; gap: 14px; max-width: 1200px; margin: 0 auto; width: 100%; }
    .boot-skel-line { height: 14px; border-radius: 4px; background: linear-gradient(90deg, #1f2228 0%, #2a2d34 50%, #1f2228 100%); background-size: 200% 100%; animation: bootShimmer 1.4s ease-in-out infinite; }
    .boot-skel-line.lg { height: 32px; max-width: 360px; }
    .boot-skel-line.md { height: 18px; max-width: 540px; }
    @keyframes bootShimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    /* React's createRoot.render() removes #root's children synchronously, so
       the skeleton is replaced in one frame. A tiny CSS fade-in on the new
       content turns the swap from a snap into a 200ms ease — no FOUC. */
    #root > *:not(.boot-skel) {
      animation: bootFadeIn 220ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    @keyframes bootFadeIn { from { opacity: 0.4; } to { opacity: 1; } }
    /* Boss QA cycle 30 — respect prefers-reduced-motion. Users with the OS
       "Reduce motion" toggle on (or assistive-tech equivalents) get the
       static dark skeleton + an instant React mount instead of the shimmer
       + fade. WCAG 2.3.3. */
    @media (prefers-reduced-motion: reduce) {
      .boot-skel-line { animation: none; }
      #root > *:not(.boot-skel) { animation: none; }
    }
  </style>
</head>
<body>
  <!-- Batch 723 — Skip-to-content link for screen-reader + keyboard-only
       users. Visually hidden until focused (see .skip-link in styles.css)
       so sighted users don't see it, but Tab-first-thing on a new page
       focuses this link and lets a keyboard user jump past the nav to
       the <main> landmark the App renders (batch 724). The href targets
       the id the SPA will eventually mount; #root is the initial
       landing spot before React mounts. Batch 927 — the click handler
       in main.js adds a temporary tabindex=-1 to the target so focus
       actually moves there (browsers default to "scroll-only" on anchor
       navigation). CSP-safe: no inline handler. -->
  <a href="#main" class="skip-link">Skip to main content</a>
  <!-- Boss QA cycle 12 — boot skeleton inside #root. React removes these
       children when it mounts, so on a fast cache hit the skeleton flashes
       for one frame; on slow 3G it gives the eye something to land on
       (logo, nav skeleton, header line) instead of a black void. -->
  <div id="root">
    <div class="boot-skel" aria-hidden="true">
      <div class="boot-skel-nav">
        <div class="boot-skel-logo"></div>
        <div class="boot-skel-brand"></div>
        <div class="boot-skel-link"></div>
        <div class="boot-skel-link"></div>
        <div class="boot-skel-link"></div>
        <div class="boot-skel-cta"></div>
      </div>
      <div class="boot-skel-main">
        <div class="boot-skel-line lg"></div>
        <div class="boot-skel-line md"></div>
        <div class="boot-skel-line md"></div>
        <div class="boot-skel-line"></div>
        <div class="boot-skel-line"></div>
      </div>
    </div>
  </div>
  <noscript>
    <div style="max-width:560px;margin:80px auto;padding:28px 32px;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#e2e7f5;background:#0d1320;border:1px solid #1e2840;border-radius:10px;text-align:center;">
      <h1 style="margin:0 0 10px;font-size:20px;color:#1ea5ff;">JavaScript required</h1>
      <p style="margin:0;color:#8a93b5;line-height:1.55;">SkinBox is a single-page application. Please enable JavaScript to browse listings, place orders, and manage your stall.</p>
    </div>
  </noscript>

  <!--
    React + React-DOM pinned to 18.2.0 with Subresource Integrity hashes.
    If unpkg is ever compromised to serve altered JS, the browser will
    refuse to run it because the sha384 won't match. To roll either
    library forward, fetch the new file and compute:
      curl -sS <url> | openssl dgst -sha384 -binary | openssl base64 -A
  -->
  <script crossorigin="anonymous"
          integrity="sha384-tMH8h3BGESGckSAVGZ82T9n90ztNXxvdwvdM6UoR56cYcf+0iGXBliJ29D+wZ/x8"
          src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script crossorigin="anonymous"
          integrity="sha384-bm7MnzvK++ykSwVJ2tynSE5TRdN+xL418osEVF2DE/L/gfWHj91J2Sphe582B1Bh"
          src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>

  <script type="module" src="/js/main.js?v=199"></script>
</body>
</html>
