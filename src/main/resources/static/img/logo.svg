<?xml version="1.0" encoding="UTF-8"?>
<!-- SkinBox — isometric-crate logo, blue-fade palette.
     Operator-approved 2026-04-19. Used in sboxmarket nav + footer.
     Source: src/main/resources/static/js/app.js nav-logo-icon block. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="sbm-top" x1="24" y1="2" x2="24" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#c0e9ff"/>
      <stop offset="100%" stop-color="#4dc8ff"/>
    </linearGradient>
    <linearGradient id="sbm-left" x1="4" y1="24" x2="24" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0a7cc9"/>
      <stop offset="100%" stop-color="#04121c"/>
    </linearGradient>
    <linearGradient id="sbm-right" x1="46" y1="24" x2="24" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#1ea5ff"/>
      <stop offset="100%" stop-color="#0d4d78"/>
    </linearGradient>
  </defs>
  <!-- top facet -->
  <path d="M24 3 L44 14 L24 25 L4 14 Z"
        fill="url(#sbm-top)"
        stroke="rgba(120,210,255,0.5)" stroke-width="0.8" stroke-linejoin="round"/>
  <!-- left facet -->
  <path d="M4 14 L24 25 L24 45 L4 34 Z"
        fill="url(#sbm-left)"
        stroke="rgba(77,200,255,0.12)" stroke-width="0.8" stroke-linejoin="round"/>
  <!-- right facet -->
  <path d="M44 14 L24 25 L24 45 L44 34 Z"
        fill="url(#sbm-right)"
        stroke="rgba(77,200,255,0.18)" stroke-width="0.8" stroke-linejoin="round"/>
  <!-- top ridge highlight -->
  <path d="M4 14 L24 3 L44 14"
        fill="none"
        stroke="rgba(192,233,255,0.75)" stroke-width="0.8" stroke-linejoin="round"/>
  <!-- vertical seam -->
  <path d="M24 25 L24 45"
        stroke="rgba(4,18,28,0.55)" stroke-width="0.8"/>
</svg>
