###
# Production profile — activate with SPRING_PROFILES_ACTIVE=prod
#
# This profile LOCKS DOWN everything the `default` profile leaves open for
# developer convenience. Ship env vars for every secret; never commit real
# keys.
###

server:
  # Graceful shutdown (batch 373). On SIGTERM (Docker stop / k8s pod
  # terminate / systemd stop) Tomcat stops accepting new requests but
  # keeps serving in-flight ones up to the timeout. Without this, a
  # rolling deploy would cut mid-request responses (e.g. a Stripe
  # webhook callback during a redeploy would 502 from the LB).
  shutdown: graceful
  error:
    # Replaced by GlobalErrorController which renders a branded HTML
    # page for browsers and a clean JSON envelope for everything else.
    # Spring's default Whitelabel page leaks "/error" + framework strings.
    whitelabel:
      enabled: false
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
  servlet:
    session:
      cookie:
        # Batch 974 — templated so `run-local.sh` can pass
        # COOKIE_SECURE=false and the browser will actually ship the
        # session cookie over HTTP on localhost. Previously this was
        # hardcoded `true`, which meant the local-prod image would set
        # Secure on every cookie and Chrome/Firefox would refuse to
        # send it back over the http://localhost:8082 session — the
        # signed-in state silently vanished on every page load in
        # local testing. Real prod deploys pass `true` (or leave
        # unset; the default below is true) so nothing downgrades.
        secure: ${COOKIE_SECURE:true}
        # Lax, not Strict — Steam OpenID and Stripe Checkout both
        # redirect the browser back to skinbox.market from their
        # domains. SameSite=Strict blocks the session cookie on those
        # cross-site top-level navigations, causing the session to
        # appear lost after login/deposit. Lax sends cookies on
        # top-level GETs (redirects) but not on cross-site POSTs,
        # which is the correct balance for OAuth/OpenID flows.
        same-site: lax
  # Tomcat tuning — pinch abusive clients without hurting legitimate users.
  # `max-http-request-header-size` caps an entire cookie-loaded header to 16KB;
  # a crafted client sending a 1MB Cookie line gets a 431 immediately instead
  # of burning a worker thread. `max-swallow-size` puts a ceiling on how much
  # Tomcat will read from an aborted request body. `connection-timeout` slices
  # a Slowloris-style attack down to a predictable cap.
  max-http-request-header-size: 16KB
  tomcat:
    max-swallow-size: 2MB
    max-http-form-post-size: 2MB
    connection-timeout: 10s
    keep-alive-timeout: 15s
    threads:
      max: 200
      min-spare: 20

spring:
  lifecycle:
    # Grace window for graceful shutdown — Tomcat waits up to this for
    # in-flight requests to complete before force-terminating.
    # Matches typical container kill-grace defaults (k8s
    # terminationGracePeriodSeconds = 30).
    timeout-per-shutdown-phase: 25s
  session:
    # 2026-05-01 — re-enabled JDBC persistence. The cookie sanitizer now
    # correctly matches SBOX_SESSION (was hardcoded to SESSION) and runs
    # at HIGHEST_PRECEDENCE so NUL-poisoned cookies get scrubbed BEFORE
    # Spring Session's filter touches the database. Operator demand:
    # "MAKE IT SO SESSION IS NOT GETTING EXPIRED ... NEVER EXPIRE".
    store-type: jdbc
    timeout: 365d
    jdbc:
      # Schema is created by V57__spring_session.sql Flyway migration.
      initialize-schema: never
      table-name: SPRING_SESSION
      cleanup-cron: '0 */15 * * * *'
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-migration-naming: true
  datasource:
    # Postgres-ready. Override at deploy time:
    #   SPRING_DATASOURCE_URL=jdbc:postgresql://db.host:5432/skinbox
    #   SPRING_DATASOURCE_DRIVER=org.postgresql.Driver
    #   SPRING_DATASOURCE_USERNAME=skinbox
    #   SPRING_DATASOURCE_PASSWORD=<env>
    url:              ${SPRING_DATASOURCE_URL}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
    username:         ${SPRING_DATASOURCE_USERNAME}
    password:         ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    # Batch 945 — removed explicit `database-platform: PostgreSQLDialect`.
    # Hibernate 6+ auto-detects the dialect from the JDBC driver and
    # warns HHH90000025 when one is supplied unnecessarily. Dropping the
    # property silences the warn and lets Hibernate pick the right class
    # (incl. future PostgreSQL-specific subclasses) without a config push.
    hibernate:
      # Never auto-mutate prod schemas. Use Flyway / Liquibase migrations.
      ddl-auto: validate
  h2:
    console:
      enabled: false

# Actuator: disabled entirely in production. management.server.port=-1
# tells Spring Boot not to register the actuator servlet — even /actuator
# root returns 404. Ops can enable it on a private management port only
# (e.g. ACTUATOR_PORT=9090) behind a firewall rule.
management:
  server:
    port: ${ACTUATOR_PORT:-1}
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: ''
  endpoint:
    health:
      show-details: never
      enabled: false

# Lock OpenAPI / Swagger off in prod by default. Flip SWAGGER_ENABLED=true
# temporarily for incident debugging.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

security:
  hsts: true
  csrf-enabled: true
  verbose-errors: false
  # CORS_ALLOWED_ORIGINS MUST be set explicitly — e.g.
  #   CORS_ALLOWED_ORIGINS=https://skinbox.example
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS}

# Logging — log to files with rotation instead of stdout spam. Ops tooling
# reads /var/log/skinbox/skinbox.log.
logging:
  level:
    com.sboxmarket:        INFO
    org.springframework:   WARN
    org.hibernate:         WARN
  file:
    name: ${LOG_FILE:/var/log/skinbox/skinbox.log}
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_FILE:/var/log/skinbox/skinbox.log}.%d{yyyy-MM-dd}.%i.gz
      max-file-size: 20MB
      max-history: 30
      total-size-cap: 2GB

admin:
  # Set ADMIN_BOOTSTRAP_STEAM_IDS in the environment to a comma-separated
  # list of Steam ID64s that should get ADMIN role on login.
  bootstrap-steam-ids: ${ADMIN_BOOTSTRAP_STEAM_IDS}

stripe:
  secret-key:      ${STRIPE_SECRET_KEY}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY}
  webhook-secret:  ${STRIPE_WEBHOOK_SECRET}
  success-url:     ${STRIPE_SUCCESS_URL}
  cancel-url:      ${STRIPE_CANCEL_URL}

steam:
  api-key:    ${STEAM_API_KEY:}
  realm:      ${STEAM_REALM}
  return-url: ${STEAM_RETURN_URL}
