###
# Production profile — activate with SPRING_PROFILES_ACTIVE=prod
#
# This profile LOCKS DOWN everything the `default` profile leaves open for
# developer convenience. Ship env vars for every secret; never commit real
# keys.
###

server:
  # Trust the proxy's X-Forwarded-* headers. The live topology is
  # Cloudflare tunnel -> nginx -> app, and the cloudflared->nginx hop is
  # plain HTTP: nginx stamps `X-Forwarded-Proto: $scheme` which is `http`
  # on that internal hop even though TLS is mandatory at the edge. Without
  # this strategy Spring's ServletRequest sees scheme=http, so:
  #   * HttpServletResponse.sendRedirect() (SteamAuthController login bounce
  #     + /return) emits `Location: http://skinbox.market/...` Location
  #     headers — the browser then gets a Cloudflare HTTPS->the redirect
  #     downgrades to http and 301-loops or trips mixed-content,
  #   * request.isSecure() is false, so any Secure-cookie / scheme-aware
  #     logic thinks the request is insecure,
  #   * ServletUriComponentsBuilder / framework absolute-URL builders emit
  #     http:// links.
  # `framework` activates Spring's ForwardedHeaderFilter which rewrites the
  # request's scheme/host/port from X-Forwarded-* BEFORE any controller or
  # the security-header filter runs — fixing all of the above centrally.
  # The per-controller `if (host == skinbox.market) proto = 'https'` hacks
  # in OpenGraphController / SitemapController become belt-and-braces rather
  # than the only thing forcing https. `framework` (not `native`) because
  # the upstream is nginx/cloudflared, not Tomcat's own RemoteIpValve, and
  # `framework` works regardless of the embedded container. Overridable via
  # SERVER_FORWARD_HEADERS_STRATEGY for an operator who fronts the app with
  # a proxy that strips the X-Forwarded-* headers.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}
  # Graceful shutdown (batch 373). On SIGTERM (Docker stop / k8s pod
  # terminate / systemd stop) Tomcat stops accepting new requests but
  # keeps serving in-flight ones up to the timeout. Without this, a
  # rolling deploy would cut mid-request responses (e.g. a Stripe
  # webhook callback during a redeploy would 502 from the LB).
  shutdown: graceful
  error:
    # Replaced by GlobalErrorController which renders a branded HTML
    # page for browsers and a clean JSON envelope for everything else.
    # Spring's default Whitelabel page leaks "/error" + framework strings.
    whitelabel:
      enabled: false
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
  servlet:
    session:
      cookie:
        # Batch 974 — templated so `run-local.sh` can pass
        # COOKIE_SECURE=false and the browser will actually ship the
        # session cookie over HTTP on localhost. Previously this was
        # hardcoded `true`, which meant the local-prod image would set
        # Secure on every cookie and Chrome/Firefox would refuse to
        # send it back over the http://localhost:8082 session — the
        # signed-in state silently vanished on every page load in
        # local testing. Real prod deploys pass `true` (or leave
        # unset; the default below is true) so nothing downgrades.
        secure: ${COOKIE_SECURE:true}
        # Lax, not Strict — Steam OpenID and Stripe Checkout both
        # redirect the browser back to skinbox.market from their
        # domains. SameSite=Strict blocks the session cookie on those
        # cross-site top-level navigations, causing the session to
        # appear lost after login/deposit. Lax sends cookies on
        # top-level GETs (redirects) but not on cross-site POSTs,
        # which is the correct balance for OAuth/OpenID flows.
        same-site: lax
  # Tomcat tuning — pinch abusive clients without hurting legitimate users.
  # `max-http-request-header-size` caps an entire cookie-loaded header to 16KB;
  # a crafted client sending a 1MB Cookie line gets a 431 immediately instead
  # of burning a worker thread. `max-swallow-size` puts a ceiling on how much
  # Tomcat will read from an aborted request body. `connection-timeout` slices
  # a Slowloris-style attack down to a predictable cap.
  max-http-request-header-size: 16KB
  tomcat:
    max-swallow-size: 2MB
    max-http-form-post-size: 2MB
    connection-timeout: 10s
    keep-alive-timeout: 15s
    threads:
      max: 200
      min-spare: 20

spring:
  lifecycle:
    # Grace window for graceful shutdown — Tomcat waits up to this for
    # in-flight requests to complete before force-terminating.
    # Matches typical container kill-grace defaults (k8s
    # terminationGracePeriodSeconds = 30).
    timeout-per-shutdown-phase: 25s
  session:
    # 2026-05-03 — DISABLED for the FOURTH time. Every prior re-enable
    # has produced an outage when poisoned Cookie values containing NUL
    # (0x00) reached the JDBC bind parameter — Postgres rejects the
    # SELECT on SPRING_SESSION with SQLSTATE 22021 and the same filter
    # runs on /error so the error page 500s too (Tomcat raw stub). The
    # 09:25 deploy commented @EnableJdbcHttpSession in SessionConfig and
    # set SPRING_SESSION_STORE_TYPE=none in env, but THIS YAML line was
    # still pinning store-type to jdbc at autoconfig time. Hard-coded
    # to 'none' here so the in-memory Tomcat session manager owns
    # sessions. Sessions are lost on container restart — acceptable
    # until the underlying NUL sanitizer is rewritten to be airtight.
    store-type: none
    timeout: 365d
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-migration-naming: true
  datasource:
    # Postgres-ready. Override at deploy time:
    #   SPRING_DATASOURCE_URL=jdbc:postgresql://db.host:5432/skinbox
    #   SPRING_DATASOURCE_DRIVER=org.postgresql.Driver
    #   SPRING_DATASOURCE_USERNAME=skinbox
    #   SPRING_DATASOURCE_PASSWORD=<env>
    url:              ${SPRING_DATASOURCE_URL}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
    username:         ${SPRING_DATASOURCE_USERNAME}
    password:         ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    # Batch 945 — removed explicit `database-platform: PostgreSQLDialect`.
    # Hibernate 6+ auto-detects the dialect from the JDBC driver and
    # warns HHH90000025 when one is supplied unnecessarily. Dropping the
    # property silences the warn and lets Hibernate pick the right class
    # (incl. future PostgreSQL-specific subclasses) without a config push.
    hibernate:
      # Never auto-mutate prod schemas. Use Flyway / Liquibase migrations.
      ddl-auto: validate
  h2:
    console:
      enabled: false

# Actuator: disabled entirely in production. management.server.port=-1
# tells Spring Boot not to register the actuator servlet — even /actuator
# root returns 404. Ops can enable it on a private management port only
# (e.g. ACTUATOR_PORT=9090) behind a firewall rule.
management:
  server:
    port: ${ACTUATOR_PORT:-1}
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: ''
  endpoint:
    health:
      show-details: never
      enabled: false

# Lock OpenAPI / Swagger off in prod by default. Flip SWAGGER_ENABLED=true
# temporarily for incident debugging.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

security:
  hsts: true
  csrf-enabled: true
  verbose-errors: false
  # CORS_ALLOWED_ORIGINS MUST be set explicitly — e.g.
  #   CORS_ALLOWED_ORIGINS=https://skinbox.example
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS}

# Logging — log to files with rotation instead of stdout spam. Ops tooling
# reads /var/log/skinbox/skinbox.log.
logging:
  level:
    com.sboxmarket:        INFO
    org.springframework:   WARN
    # Explicit override — default application.yml pins
    # `org.springframework.web: INFO` so DispatcherServlet + the web tier
    # log every request line. Spring Boot MERGES logging.level keys across
    # profile files (it does not replace the map), so without redeclaring
    # the child here the `org.springframework: WARN` baseline is silently
    # overridden for the web logger only, and request URIs (including
    # query strings with Stripe session_id / Steam OpenID nonce / CSR
    # support-ticket tokens) end up in /var/log/skinbox/skinbox.log at
    # INFO. Pin the child to WARN to match the parent's prod intent.
    org.springframework.web: WARN
    org.hibernate:         WARN
  file:
    name: ${LOG_FILE:/var/log/skinbox/skinbox.log}
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_FILE:/var/log/skinbox/skinbox.log}.%d{yyyy-MM-dd}.%i.gz
      max-file-size: 20MB
      max-history: 30
      total-size-cap: 2GB

admin:
  # Set ADMIN_BOOTSTRAP_STEAM_IDS in the environment to a comma-separated
  # list of Steam ID64s that should get ADMIN role on login.
  bootstrap-steam-ids: ${ADMIN_BOOTSTRAP_STEAM_IDS}

stripe:
  secret-key:      ${STRIPE_SECRET_KEY}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY}
  webhook-secret:  ${STRIPE_WEBHOOK_SECRET}
  success-url:     ${STRIPE_SUCCESS_URL}
  cancel-url:      ${STRIPE_CANCEL_URL}
  # Stripe Connect (Express) payout rail. The return/refresh URLs are
  # where Stripe sends the seller back after the hosted onboarding flow
  # (return = finished, refresh = link expired → mint a new one). They
  # default under app.public-url in StripeService's @Value fallbacks, so
  # these env vars are optional overrides; set them if onboarding should
  # land somewhere other than `${APP_PUBLIC_URL}/wallet`. `country` is the
  # two-letter ISO country the connected accounts are created in (default
  # US). Activate Stripe Connect in the Stripe Dashboard before going live
  # — see the operator runbook.
  connect:
    return-url:  ${STRIPE_CONNECT_RETURN_URL:${app.public-url}/wallet?connect=done}
    refresh-url: ${STRIPE_CONNECT_REFRESH_URL:${app.public-url}/wallet?connect=refresh}
    country:     ${STRIPE_CONNECT_COUNTRY:US}

steam:
  api-key:    ${STEAM_API_KEY:}
  realm:      ${STEAM_REALM}
  return-url: ${STEAM_RETURN_URL}
  # Bot-escrow sidecar — see steam-bot/.env.example. When STEAM_BOT_BASE_URL
  # is UNSET the entire deposit/delivery/escrow path is inert
  # (SteamTradeBotService.enabled == false): listings are created ACTIVE the
  # legacy way (no deposit required), nothing is scheduled, and nothing errors.
  # So prod is safe to boot before the bot host is live. Set both to go live.
  bot:
    base-url:  ${STEAM_BOT_BASE_URL:}
    api-token: ${BOT_API_TOKEN:}
  delivery:
    # Master switch for the buyer-delivery poller (independent of the bot
    # enabled flag). test-asset-id is an EXPLICIT staging override only — real
    # delivery resolves the bot-held asset from custody (SteamEscrowService).
    enabled:       ${STEAM_DELIVERY_ENABLED:true}
    test-asset-id: ${STEAM_DELIVERY_TEST_ASSET_ID:}
  escrow:
    # Master switch for the seller->bot deposit-confirm + return sweeps
    # (independent of the bot enabled flag). Mirrors steam.delivery.enabled.
    enabled: ${STEAM_ESCROW_ENABLED:true}

# Email unsubscribe link HMAC secret. MUST be set in prod — the @Value
# fallback in EmailService is a publicly-committed dev placeholder
# (`dev-only-do-not-use-in-production-7f3a9c`). Without this override,
# anyone reading the source can forge unsubscribe tokens for any user's
# email address and silently mute their notifications.
app:
  unsubscribe:
    secret: ${APP_UNSUBSCRIBE_SECRET}
