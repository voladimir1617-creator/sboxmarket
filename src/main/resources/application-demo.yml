# ─────────────────────────────────────────────────────────────────────────────
# PUBLIC DEMO profile — SPRING_PROFILES_ACTIVE=demo
#
# A copy of the site anyone on the internet can browse, on a free host
# (render.yaml), backed by a real Postgres. It is NOT the money deployment:
#
#   * No real money, ever. PublicDemoGuard refuses to start if a live Stripe
#     key, dev-login or dev-credit is configured, or if `prod` is also active.
#   * Deposits, withdrawals, seller payouts, the Stripe webhook, admin, CSR
#     and the database console all answer 404 (PublicDemoFilter).
#   * The catalogue is the demo seed (sbox.seed.demo-data=true below), so the
#     market has items, listings and price history to look at.
#
# Going live with real money is the `prod` profile, after his typed "go live".
# ─────────────────────────────────────────────────────────────────────────────

server:
  address: 0.0.0.0
  # Render (and most PaaS hosts) hand the port in $PORT.
  port: ${PORT:${SERVER_PORT:8082}}
  forward-headers-strategy: framework
  shutdown: graceful
  servlet:
    session:
      cookie:
        # The host terminates HTTPS in front of us; the browser only ever
        # sees https, so the cookie must be Secure. COOKIE_SECURE=false only
        # for a local plain-http smoke test.
        secure: ${COOKIE_SECURE:true}
  tomcat:
    # 512 MB free instance: 200 threads x 1 MB stacks is most of the box.
    threads:
      max: ${SERVER_THREADS_MAX:40}
      min-spare: ${SERVER_THREADS_MIN_SPARE:4}

spring:
  datasource:
    # Either a full JDBC URL, or the pieces render.yaml wires from the
    # Render Postgres (host / port / database / user / password).
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:skinbox}}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:skinbox}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    hikari:
      pool-name: sboxmarket-demo-pool
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: 1
  # Same schema path as prod: Flyway owns the tables, Hibernate only checks.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
  h2:
    console:
      enabled: false

security:
  hsts: true
  csrf-enabled: true
  verbose-errors: false
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:${app.public-url}}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# No Stripe account on the demo. Blank keys classify as SIMULATED (MoneyMode),
# and every route that would move even simulated money is shut by
# PublicDemoFilter, so nothing on this host can create a balance.
stripe:
  secret-key: ''
  publishable-key: ''
  webhook-secret: ''

steam:
  delivery:
    enabled: false
  escrow:
    enabled: false
  bot:
    base-url: ''
    api-token: ''

# Nobody is admin on the demo (and /api/admin is shut anyway).
admin:
  bootstrap-steam-ids: ''

app:
  # Render sets RENDER_EXTERNAL_URL to https://<name>.onrender.com.
  public-url: ${APP_PUBLIC_URL:${RENDER_EXTERNAL_URL:http://localhost:${server.port}}}
  steam-price-sync:
    enabled: false
  unsubscribe:
    secret: ${APP_UNSUBSCRIBE_SECRET:}

sbox:
  seed:
    demo-data: ${SBOX_SEED_DEMO_DATA:true}
  public-demo:
    enabled: true

sentry:
  environment: demo

logging:
  level:
    com.sboxmarket: INFO
    org.springframework: WARN
    org.hibernate: WARN
