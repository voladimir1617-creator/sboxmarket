server:
  # Default 8082 — the operator's owner-QA watchdog (the every-minute
  # "sboxmarket owner QA" automation, the three .claude/watchdog QA
  # scripts, and codex-agent-lane.ps1's health probe) all target
  # localhost:8082. Defaulting to 8080 silently broke that QA loop.
  # Still overridable via SERVER_PORT; prod sets its own port.
  port: ${SERVER_PORT:8082}
  ###
  # Tomcat connection hardening — MUST NOT live only in application-prod.yml.
  #
  # THE WEDGE THIS FIXES (measured 2026-08-31, reproduced and fix-verified):
  # a long-lived instance stops answering. TCP still accepts, nothing ever
  # responds, a 60s client sees HTTP 000. A thread dump shows the acceptor and
  # poller healthy, every worker parked, and most of them at cpu=0.00ms — they
  # were spawned and never reached application code.
  #
  # Cause: Tomcat writes a response body with a BLOCKING write, and the worker
  # is pinned for the whole write. A client that stops reading (backgrounded
  # tab, dead mobile connection, a dropped Cloudflare tunnel hop, an aborted
  # fetch) leaves its worker in
  #     NioEndpoint$NioSocketWrapper.doWrite -> Object.wait()
  # and this app ships big JSON bodies (a 200-row /api/listings is ~74KB, plus
  # the admin CSV exports and the sitemap), so a stalled reader holds a thread
  # for a long time. Enough of them and all `threads.max` workers are pinned;
  # new connections then sit in the kernel accept queue, which is exactly
  # "TCP accepts, never responds".
  #
  # `application-prod.yml` already sets connection-timeout/keep-alive-timeout,
  # but `application.yml` did NOT — and the default profile is what actually
  # runs (the operator's own instance boots with `profiles: default`). So the
  # one deployment taking real traffic had none of this. Hardening belongs on
  # the BASE profile so no profile can be missing it; prod still overrides with
  # its own tighter 10s/15s.
  #
  # MEASURED, identical load (400 slowloris + 250 non-reading readers), same
  # jar, same data — the only difference is these keys:
  #   without: 200/200 workers pinned, 50 stuck in doWrite, peak latency 53.87s
  #   with:     53 workers,              0 stuck in doWrite, peak latency  0.03s
  #
  # connection-timeout also bounds the blocking WRITE (Tomcat applies it as the
  # socket write timeout during request processing), which is the half that
  # matters here — not just the request-line read it is usually described as.
  # 20s is deliberately generous versus prod's 10s: it must never cut off a
  # legitimate slow mobile client fetching a large page, only a stalled one.
  ###
  max-http-request-header-size: ${SERVER_MAX_HEADER_SIZE:16KB}
  tomcat:
    connection-timeout: ${SERVER_CONNECTION_TIMEOUT:20s}
    keep-alive-timeout: ${SERVER_KEEP_ALIVE_TIMEOUT:15s}
    max-swallow-size: 2MB
    max-http-form-post-size: 2MB
    threads:
      max: ${SERVER_THREADS_MAX:200}
      min-spare: ${SERVER_THREADS_MIN_SPARE:20}
  # Session cookie hardening — HttpOnly is always on, Secure + SameSite
  # controlled by env so local HTTP dev still works.
  servlet:
    session:
      # 365 days — operator demand 2026-05-01: "NEVER EXPIRE ACTUALLY".
      # Was 45m which was logging users out mid-browse. Spring Session
      # JDBC honours this for the server-side row TTL too (see
      # SessionConfig @EnableJdbcHttpSession maxInactiveIntervalInSeconds).
      timeout: 365d
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: ${COOKIE_SAME_SITE:lax}
        name: SBOX_SESSION
        # 365-day cookie max-age so the browser keeps replaying the
        # session token across browser restarts (not just within one
        # browser run). Without max-age, the cookie is a session-only
        # cookie that the browser discards on close — effectively
        # signing the user out the next time they open Chrome.
        max-age: 365d
  # Gzip small JSON + static assets so we don't need Nginx for compression.
  # Batch 682 — added application/xml + text/csv so /sitemap.xml (SEO
  # crawler traffic) and the wallet / my-stall CSV exports compress too.
  # Sitemap can grow to hundreds of KB once the catalogue + stall set
  # fills out; gzip cuts that by ~80% for every crawler fetch.
  # Batch 716 — added text/javascript because Spring Boot's default
  # MIME type for .js files is `text/javascript` (IANA recommends this
  # over the older `application/javascript`). Without it, the ~290KB
  # app.js bundle shipped uncompressed on every first-visit page load.
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/xml,text/csv,text/html,text/css,text/plain,application/javascript,text/javascript,image/svg+xml
    min-response-size: 1024
  # Replace Spring's Whitelabel error page with our branded
  # GlobalErrorController. Without these flags the Whitelabel page
  # leaks framework strings to unauthenticated visitors.
  error:
    whitelabel:
      enabled: false
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

# Cap request bodies to 2MB. The only JSON payloads we accept are small
# objects (offers, bids, deposits, support messages) and a 50-item cart.
# Anything larger is abuse. Without this ceiling a client could POST a
# 100MB body and hold a Tomcat worker hostage until the OOM killer fires.
spring.servlet.multipart:
  max-file-size: 2MB
  max-request-size: 2MB

spring:
  application:
    name: sboxmarket

  datasource:
    # File-mode H2 — wallet balances, listings, transactions, offers all persist
    # across server restarts. Swap to PostgreSQL in production via env vars below,
    # e.g. SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/skinbox
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/sboxmarket;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;MODE=PostgreSQL}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    # Batch 945 — removed `database-platform` (was H2Dialect). Hibernate
    # 6+ auto-detects from the JDBC driver and emits HHH90000025 if one
    # is explicitly set. Same fix applied to application-prod.yml.
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # Flyway is enabled only in the prod profile. In dev we let JPA's
  # ddl-auto: update handle schema evolution so developers don't have to
  # hand-write a migration for every entity tweak.
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ── Email (optional) ──────────────────────────────────────────
  # When SMTP_HOST is set, EmailService switches from its log-sink
  # fallback to real delivery via JavaMailSender. Works with any RFC-5321
  # relay (Postmark / SES / Resend / Mailgun / Gmail app password). Leave
  # unset for local dev and CI — tokens end up in the server log instead.
  mail:
    host:     ${SMTP_HOST:}
    port:     ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  h2:
    console:
      # H2 console is OFF by default — even in local dev — because the
      # endpoint takes no authentication and lets anyone run arbitrary SQL
      # (including DROP TABLE) against the database AND leak the server's
      # filesystem path. If a developer genuinely needs it, explicitly
      # opt in by exporting H2_CONSOLE=true for that session only.
      enabled: ${H2_CONSOLE:false}
      path: /h2-console

# Actuator — disabled completely. Setting `management.server.port=-1` tells
# Spring Boot NOT to register the actuator servlet at all, so even the root
# `/actuator` discovery endpoint (which previously leaked `{_links: {...}}`
# to anonymous callers) returns 404. Developers who need actuator locally
# can opt back in with ACTUATOR_PORT=8081 — a separate management port,
# never the public one.
management:
  server:
    port: ${ACTUATOR_PORT:-1}
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: ''
  endpoint:
    health:
      show-details: never
      enabled: false

# Extra security toggles read by CorrelationIdFilter, CsrfFilter, and the
# global exception handler.
security:
  # Set to `true` in production to enable HSTS (HTTP-over-TLS only).
  hsts: ${SECURITY_HSTS:false}
  # Comma-separated list of origins allowed to hit /api/**. Defaults to `*`
  # for local dev but MUST be locked down in production.
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  # CSRF filter — leave ON unless you are testing individual endpoints.
  csrf-enabled: ${SECURITY_CSRF:true}
  # When ON, the GlobalExceptionHandler echoes the request path and the raw
  # exception message back to the client for easier debugging. OFF by default
  # because "Listing not found: 99999999" is a free resource-enumeration hint.
  # Developers can opt in with SECURITY_VERBOSE_ERRORS=true for a session.
  verbose-errors: ${SECURITY_VERBOSE_ERRORS:false}

# Swagger/OpenAPI — OFF by default. Flip SWAGGER_ENABLED=true only when you
# need to generate a schema or debug a specific endpoint. The full OpenAPI
# spec lists every parameter of every endpoint and is an attacker's
# blueprint.
springdoc:
  api-docs:
    path: /api-docs
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:false}
    operationsSorter: method

stripe:
  secret-key:     ${STRIPE_SECRET_KEY:sk_test_replace_me}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:pk_test_replace_me}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_replace_me}
  success-url:    ${STRIPE_SUCCESS_URL:${app.public-url}/?deposit=success}
  cancel-url:     ${STRIPE_CANCEL_URL:${app.public-url}/?deposit=cancel}
  currency:       usd

steam:
  api-key:    ${STEAM_API_KEY:}
  realm:      ${STEAM_REALM:${app.public-url}/}
  return-url: ${STEAM_RETURN_URL:${app.public-url}/api/auth/steam/return}

admin:
  # Comma-separated list of Steam ID 64s that get auto-promoted to ADMIN on
  # login. The default below bakes in the operator's Steam ID so they're
  # admin automatically on first boot with no env-var setup. Override at
  # deploy time by setting ADMIN_BOOTSTRAP_STEAM_IDS (comma-separated) to
  # add more admins or swap the owner.
  bootstrap-steam-ids: ${ADMIN_BOOTSTRAP_STEAM_IDS:76561199839805014}

csr:
  # Maximum size of a single CSR goodwill credit, in USD. Anything above
  # this requires a full admin to approve. Defaults to $25 per adjustment.
  credit-cap: ${CSR_CREDIT_CAP:25.00}

trade:
  # Days a trade can sit in PENDING_BUYER_CONFIRM before the sweeper
  # auto-releases funds to the seller. 8 days matches the Steam trade hold
  # window. Shorten during incidents via TRADE_AUTO_RELEASE_DAYS=1.
  auto-release-days: ${TRADE_AUTO_RELEASE_DAYS:8}

# Payment-processor rates. These are PASS-THROUGH: the user is credited net
# of the deposit fee and paid out net of the payout fee, and the platform's
# own revenue is the 2% selling fee alone (TradeService.FEE_RATE) — see
# UNIT-ECONOMICS.md.
#
# THESE ARE LIST PRICES AND THEY ARE WHAT THE USER IS CHARGED. Set them to
# your actual negotiated Stripe rates. Too high and you are overcharging real
# users on every deposit; too low and the platform silently eats the
# difference on every one. The gap shows up as the treasury residual
# (PROCESSING_RECOVERY credits minus PROCESSING_COST debits) — if that number
# trends away from ~zero, one of these four is wrong.
platform:
  # Card deposit — Stripe US standard is 2.9% + $0.30.
  processing-fee-percent: ${PLATFORM_PROCESSING_FEE_PERCENT:2.9}
  processing-fee-fixed:   ${PLATFORM_PROCESSING_FEE_FIXED:0.30}
  # Connect payout — roughly 0.25% + $0.25. Deliberately separate knobs from
  # the deposit rate: the two legs are priced an order of magnitude apart, and
  # a single shared rate would force the operator to be wrong on one of them.
  payout-fee-percent:     ${PLATFORM_PAYOUT_FEE_PERCENT:0.25}
  payout-fee-fixed:       ${PLATFORM_PAYOUT_FEE_FIXED:0.25}

# Outgoing-email settings read by EmailService.
app:
  email:
    from:      ${EMAIL_FROM:no-reply@skinbox.local}
    from-name: ${EMAIL_FROM_NAME:SkinBox}
  public-url:  ${APP_PUBLIC_URL:http://localhost:${server.port}}
  # Listing-floor refresh sweep — recomputes every catalogue item's
  # `lowestPrice` from active listings every 60s. ON by default; ops
  # can flip it off via APP_PRICE_REFRESH_ENABLED=false without a
  # redeploy if the sweep ever misbehaves under load. The on-mutation
  # path (ListingService.updateItemFloorPrice) keeps prices fresh in
  # the happy case — this sweep covers off-path drift.
  price-refresh:
    enabled: ${APP_PRICE_REFRESH_ENABLED:true}

# Sentry — error tracking + performance. Set SENTRY_DSN in the environment
# to enable. When unset the SDK is a silent no-op.
sentry:
  dsn: ${SENTRY_DSN:}
  traces-sample-rate: 0.1
  environment: ${SENTRY_ENV:development}
  send-default-pii: false

logging:
  level:
    com.sboxmarket: DEBUG
    org.springframework.web: INFO
