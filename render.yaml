# Render Blueprint: the public DEMO copy of SkinBox on Render's free plan.
# The "Deploy to Render" button in docs/HOSTING.md reads this file.
#
# It creates the website on Render's free plan (skinbox-demo, built from
# ./Dockerfile). The database is a free Neon Postgres, set up separately:
# see docs/HOSTING.md.
#
# The demo profile (application-demo.yml) keeps every money and staff route
# shut and refuses to start with live Stripe keys or dev sign-in, so nothing
# here can take or pay out real money. Real money is the `prod` profile and
# waits for the owner's "go live".
services:
  - type: web
    name: skinbox-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      # Sized for the 512 MB free instance.
      - key: JAVA_TOOL_OPTIONS
        value: >-
          -XX:+UseSerialGC -Xss512k -XX:MaxRAMPercentage=60.0
          -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=48m
          -XX:TieredStopAtLevel=1 -Djava.security.egd=file:/dev/./urandom
      - key: APP_UNSUBSCRIBE_SECRET
        generateValue: true
      # Database: a free Neon Postgres (neon.tech, 1 GB, no expiry, no card).
      # Render's own free Postgres is deleted 30 days after it is made, so
      # it is not used. Paste these three from Neon's "Connection string"
      # (Java / JDBC tab) into the service's Environment yourself.
      #   SPRING_DATASOURCE_URL       jdbc:postgresql://<host>/<db>?sslmode=require
      #   SPRING_DATASOURCE_USERNAME  <user>
      #   SPRING_DATASOURCE_PASSWORD  <password>
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
