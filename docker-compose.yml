services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: skinbox
      POSTGRES_PASSWORD: ${DB_PASSWORD:-skinbox}
      POSTGRES_DB: skinbox
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skinbox"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Container side is 8082 because that is what the app binds
      # (application.yml -> server.port: ${SERVER_PORT:8082}). This published
      # 8080:8080, so nothing was ever reachable and the Dockerfile HEALTHCHECK
      # (which probes the container's own port) could never pass either.
      # Host side stays a separate knob: deploy/run-local.sh's edge container
      # also defaults to host 8082, so override APP_PORT if you run both stacks
      # on one box.
      - "${APP_PORT:-8082}:8082"
    # Real secrets (Stripe live keys, SMTP password, Steam API key, Sentry DSN)
    # come from an operator-supplied env file — NEVER committed, NEVER baked
    # into the image. Copy deploy/skinbox.env.example -> deploy/skinbox.env and
    # fill in real values. The explicit `environment:` block below provides
    # safe non-secret defaults; env_file entries override anything also set
    # there. Marked optional so `docker compose up` still works for a bare
    # local smoke test before the operator has written the file.
    env_file:
      - path: deploy/skinbox.env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Explicit so the app, the published port and the Dockerfile HEALTHCHECK
      # can never disagree again — all three now read 8082 from one place.
      SERVER_PORT: ${SERVER_PORT:-8082}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/skinbox
      SPRING_DATASOURCE_USERNAME: skinbox
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-skinbox}
      ADMIN_BOOTSTRAP_STEAM_IDS: ${ADMIN_BOOTSTRAP_STEAM_IDS:-76561197960287930}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://skinbox.market}
      # NO DEFAULT, on purpose. This used to default to `sk_test_dummy`, which
      # ProdConfigValidator rejects outright ("STRIPE_SECRET_KEY is a Stripe
      # TEST key ... refusing to start"). Because that check runs on
      # ApplicationReadyEvent and calls System.exit(1) — i.e. AFTER Tomcat has
      # bound — and this service is `restart: unless-stopped`, the result was an
      # endless boot/exit/restart crash loop rather than a clean failure. The
      # validator is right and must not be weakened: it is the control that
      # stops production processing real customer money through a test key.
      # What was wrong was shipping a default guaranteed to trip it.
      #
      # `:?` fails at `docker compose up` time with this message, before any
      # container starts, so the operator gets one actionable line instead of a
      # restarting container. For a local smoke test, do not use the prod
      # profile (note Dockerfile also bakes ENV SPRING_PROFILES_ACTIVE=prod, so
      # it must be overridden here AND there).
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?set STRIPE_SECRET_KEY (a real sk_live_... key) in deploy/skinbox.env - the prod profile refuses to start with a sk_test_ key}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-pk_test_dummy}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_dummy}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-https://skinbox.market/?deposit=success}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-https://skinbox.market/?deposit=cancel}
      STEAM_REALM: ${STEAM_REALM:-https://skinbox.market/}
      STEAM_RETURN_URL: ${STEAM_RETURN_URL:-https://skinbox.market/api/auth/steam/return}
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      APP_EMAIL_FROM: ${APP_EMAIL_FROM:-onboarding@resend.dev}
      # HMAC secret that signs one-click email unsubscribe links. application-prod.yml
      # references ${APP_UNSUBSCRIBE_SECRET} with NO default, so emailService (and the
      # apiKeyService -> apiKeyAuthFilter chain that injects it) fails to construct
      # without it: a bare `docker compose up` smoke boot dies at startup with
      # "Could not resolve placeholder 'APP_UNSUBSCRIBE_SECRET'". Provide a local
      # dummy so the smoke boot works; a real deploy MUST override this via
      # deploy/skinbox.env with a strong random secret (rotating it invalidates any
      # outstanding unsubscribe links).
      APP_UNSUBSCRIBE_SECRET: ${APP_UNSUBSCRIBE_SECRET:-local-dev-unsubscribe-secret-change-me}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://skinbox.market}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENV: ${SENTRY_ENV:-production}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      SECURITY_HSTS: ${SECURITY_HSTS:-true}
      SECURITY_CSRF: ${SECURITY_CSRF:-true}
      TRADE_AUTO_RELEASE_DAYS: ${TRADE_AUTO_RELEASE_DAYS:-8}
    restart: unless-stopped

volumes:
  pgdata:
