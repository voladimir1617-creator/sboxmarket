name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancel previous runs for the same branch so a rapid re-push doesn't
# leave a queue of redundant builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + Test + Docker
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Grant gradlew execute permission
        run: chmod +x ./gradlew

      - name: Compile
        run: ./gradlew compileGroovy compileTestGroovy --no-daemon

      - name: Run unit tests (Spock)
        run: ./gradlew test --no-daemon

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test/

      - name: Build fat JAR
        run: ./gradlew bootJar --no-daemon

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: sboxmarket-jar
          path: build/libs/sboxmarket-*.jar
          retention-days: 14

      - name: Verify Flyway migrations are valid SQL
        run: |
          # Baseline sanity — make sure every migration file parses as SQL.
          # This does NOT run them against a DB; it just catches the obvious
          # mistakes (dangling semicolons, BOM bytes, wrong filename).
          for f in src/main/resources/db/migration/V*.sql; do
            echo "::group::$(basename "$f")"
            head -3 "$f"
            echo "::endgroup::"
          done

  k6-smoke:
    name: k6 load smoke (${{ github.event.pull_request.head.ref || github.ref_name }})
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Download fat JAR from build job
        uses: actions/download-artifact@v4
        with:
          name: sboxmarket-jar
          path: build/libs

      - name: Boot app on port 8082 with H2 default profile
        # Background launch; no Postgres dependency. The H2 default profile
        # is enough to exercise the public/anon code paths the smoke test
        # walks (/, /api/listings, /api/items/{id}, etc.). Rate-limit + CSRF
        # filters stay on so any regression in the hot-path filter chain
        # surfaces here before reaching the prod container.
        #
        # In-memory H2 without AUTO_SERVER: the default URL opens an H2
        # network listener, and H2CredentialGuard refuses to boot it with a
        # blank password. The demo catalogue is opt-in now, and the smoke
        # walks /api/listings/stall/1 and /api/items/1..80, so ask for it.
        run: |
          java -Xms256m -Xmx512m -jar build/libs/sboxmarket-*.jar \
            --server.port=8082 \
            --logging.level.root=WARN \
            "--spring.datasource.url=jdbc:h2:mem:k6smoke;DB_CLOSE_DELAY=-1;MODE=PostgreSQL" \
            --sbox.seed.demo-data=true \
            > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for /api/health
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:8082/api/health > /dev/null; then
              echo "App is UP after $i seconds"
              exit 0
            fi
            sleep 1
          done
          echo "App did not come up in 60s — last log lines:"
          tail -100 app.log
          exit 1

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -qq
          sudo apt-get install -y k6

      - name: Run smoke load test
        run: |
          BASE_URL=http://localhost:8082 k6 run --quiet deploy/load-test.js

      - name: Print app log on failure
        if: failure()
        run: tail -200 app.log

      - name: Stop app
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill "$(cat app.pid)" 2>/dev/null || true
          fi

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Download fat JAR from build job
        uses: actions/download-artifact@v4
        with:
          name: sboxmarket-jar
          path: build/libs

      - name: Boot app on port 8082 with dev sign-in and test money
        # A throwaway in-memory database whose accounts are worthless, so
        # both QA doors are opened here and nowhere else: dev sign-in for the
        # test users, and the dev-mode deposit the money flows are paid with.
        # Stripe has no keys, so nothing can move real money. Every outbound
        # HTTP(S) call from the JVM goes to a dead proxy: the tests never
        # reach Steam or any other outside site.
        env:
          SBOX_DEV_LOGIN_ENABLED: 'true'
          SBOX_DEV_CREDIT_ENABLED: 'true'
          JAVA_TOOL_OPTIONS: >-
            -Dhttps.proxyHost=127.0.0.1 -Dhttps.proxyPort=9
            -Dhttp.proxyHost=127.0.0.1 -Dhttp.proxyPort=9
            -Dhttp.nonProxyHosts=localhost|127.0.0.1
        run: |
          java -Xms256m -Xmx1g -jar build/libs/sboxmarket-*.jar \
            --server.port=8082 \
            --logging.level.root=WARN \
            "--spring.datasource.url=jdbc:h2:mem:e2e;DB_CLOSE_DELAY=-1;MODE=PostgreSQL" \
            --sbox.seed.demo-data=true \
            > app.log 2>&1 &
          echo $! > app.pid

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright and Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Wait for /api/health
        run: |
          for i in {1..90}; do
            if curl -sf http://localhost:8082/api/health > /dev/null; then
              echo "App is UP after $i seconds"
              exit 0
            fi
            sleep 1
          done
          echo "App did not come up in 90s — last log lines:"
          tail -100 app.log
          exit 1

      - name: Run signed-out, signed-in and three-user market tests
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8082
        run: npx playwright test --project=anon --project=chromium-auth --project=multi-user

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

      - name: Print app log on failure
        if: failure()
        run: tail -200 app.log

      - name: Stop app
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill "$(cat app.pid)" 2>/dev/null || true
          fi

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push in CI — extend to push to GHCR when needed)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: sboxmarket:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
