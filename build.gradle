plugins {
    id 'groovy'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.sboxmarket'
version = '1.0.0'
sourceCompatibility = '17'

repositories {
    mavenCentral()
}

// Boot 3.5.16 ships Tomcat 10.1.55; keep the newer 10.1.60 patch this repo
// already ran on (multipart and partial-PUT CVE fixes). Same 10.1 line.
ext['tomcat.version'] = '10.1.60'

// commons-lang3: Boot 3.5.16 manages 3.17.0; 3.18.0 fixes CVE-2025-48924
// (unbounded recursion). Not called directly by app code. (pgjdbc no longer
// needs a pin: Boot 3.5.16 already manages the patched 42.7.11.)
ext['commons-lang3.version'] = '3.18.0'

dependencies {
    // Groovy
    implementation 'org.apache.groovy:groovy:4.0.18'
    implementation 'org.apache.groovy:groovy-json:4.0.18'
    implementation 'org.apache.groovy:groovy-xml:4.0.18'

    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Spring Session JDBC — wired via SessionConfig.groovy with @Profile("prod")
    // so the test profile doesn't load it and the existing MockMvc specs keep
    // working unchanged. In prod, sessions persist in Postgres so a Docker
    // restart no longer signs every user out.
    implementation 'org.springframework.session:spring-session-jdbc'
    // JavaMail wrapper. Used by EmailService to send verification emails
    // when SMTP_HOST is set; otherwise EmailService falls back to a
    // log-only sink so local dev and CI never need an SMTP relay.
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // Database
    runtimeOnly 'com.h2database:h2'
    // Postgres runtime for the prod profile (no effect in dev)
    runtimeOnly 'org.postgresql:postgresql'
    // Flyway for prod schema migrations — runs at startup BEFORE JPA validates.
    // Flyway 10+ (Boot 3.5 manages 11.x) moved Postgres support into its own
    // module; without it a prod boot fails with "Unsupported Database".
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Utils
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // Stripe
    implementation 'com.stripe:stripe-java:24.16.0'

    // Sentry — runtime error tracking + performance monitoring.
    // Spring Boot auto-config picks up SENTRY_DSN from the environment;
    // when unset, the SDK is a silent no-op so dev/CI aren't affected.
    implementation 'io.sentry:sentry-spring-boot-starter-jakarta:7.6.0'

    // Structured (JSON) logging encoder for the `prod` profile. logback-spring.xml
    // wires LogstashEncoder onto the console + rolling-file appenders so prod logs
    // are machine-parseable (level/logger/thread/MDC `cid`) for Loki/ELK/Datadog.
    // The 8.x line targets logback 1.5, which Spring Boot 3.5 bundles.
    implementation 'net.logstash.logback:logstash-logback-encoder:8.1'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Spock 2.4-M6 restores @Autowired field injection into Groovy specs
    // with Spring Boot 3.x — the 2.3 line was silently leaving fields null
    // under this exact JVM/Gradle/Groovy combination. The M-release is the
    // latest on maven central as of 2026-04 and has been stable in CI for
    // us through 2.3 → 2.4 upgrade testing.
    testImplementation 'org.spockframework:spock-core:2.4-M6-groovy-4.0'
    testImplementation 'org.spockframework:spock-spring:2.4-M6-groovy-4.0'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat = 'short'
    }
}

// ─────────────────────────────────────────────────────────────────────────────
// A GUARD MUST NOT CACHE ITS OWN VERDICT.
//
// AdminBootstrapIsNotCommittedSpec sweeps every worktree registered to this
// repository and every ref, looking for a committed admin identity. NONE of
// that is an input Gradle can see: the answer depends on `git worktree list`,
// on refs, and on files in other checkouts entirely.
//
// So `:test` goes UP-TO-DATE while the thing under test changes. Measured
// 2026-09-25: with a compromised worktree freshly registered at
// `.claude/worktrees/`, `./gradlew test --tests ...AdminBootstrapIsNotCommitted*`
// reported **BUILD SUCCESSFUL in 1s** and left the previous run's
// `TEST-...xml` in place — 0 failures, off a result file that predated the
// breach. Re-run with `--rerun-tasks` it was RED with 2 failures. A stale
// green is the same defect the spec itself exists to catch, one level up:
// absence of a fresh answer read as a positive one.
//
// This task therefore never goes up to date, and it is wired into `check` so
// it actually runs. The filter also means that DELETING or RENAMING the spec
// fails the build ("No tests found for given includes") rather than silently
// removing the guard.
//
// It writes to build/test-results/adminBootstrapGuard/, separate from :test.
//
// NOTE ON SCOPE: because the sweep covers every REGISTERED worktree, a
// compromised checkout belonging to someone else turns this red for everyone
// on the machine. That is deliberate — anyone can build from a registered
// worktree — and the failure message names the offending path and identity.
// ─────────────────────────────────────────────────────────────────────────────
tasks.register('adminBootstrapGuard', Test) {
    group = 'verification'
    description = 'Sweeps EVERY registered worktree and ref for a committed admin identity. Never cached.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter { includeTestsMatching 'com.sboxmarket.AdminBootstrapIsNotCommittedSpec' }
    outputs.upToDateWhen { false }
    testLogging {
        events 'failed'
        exceptionFormat = 'short'
    }
}
tasks.named('check') { dependsOn 'adminBootstrapGuard' }

// Required so Spring can read @RequestParam / @PathVariable names from
// compiled Groovy method parameters via reflection.
tasks.withType(GroovyCompile).configureEach {
    groovyOptions.parameters = true
    // Fork the Groovy compiler into its own JVM with a dedicated heap.
    // The test source set is ~190 Spock specs; compiling them all in ONE
    // joint pass (a clean / non-incremental build, e.g. CI or after a
    // gradle.properties bump) exhausts the in-process compiler heap and
    // dies with `java.lang.OutOfMemoryError: Java heap space` regardless
    // of the daemon's -Xmx (the in-process compiler doesn't reliably get
    // the daemon's full heap under contention). Forking gives the compile
    // a guaranteed dedicated 6g, independent of daemon state — so CI and
    // clean local builds compile the full suite deterministically.
    groovyOptions.fork = true
    groovyOptions.forkOptions.memoryMaximumSize = '6g'
}
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}

// ─────────────────────────────────────────────────────────────────────────────
// THE SHIPPED JS AND CSS ARE SHRUNK; THE SOURCE IS NOT.
//
// src/main/resources/static stays exactly as written: commented, readable, and
// what every spec and `bootRun` reads. Only the copy packed into the boot jar
// is shrunk, by esbuild, one file at a time with no bundling (imports, ?v=
// tokens and file names are untouched):
//   static/js/*.js   --minify            comments, whitespace, local names
//   static/css/*.css --minify-whitespace comments and whitespace only. Full
//                    CSS minify rewrites oklch() colours as hex, which is not
//                    exact, so it is not used.
// js/vendor/ (already minified, SRI-pinned) and every HTML file are copied
// as they are.
//
// Measured 2026-10-16 on a throttled phone (390x844, Slow 4G, 4x CPU, 7 runs):
// home first contentful paint 3.96s -> 2.78s; first-screen JS 241 -> 91 KB
// gzipped, design.css 314 -> 260 KB gzipped.
//
// esbuild's binary comes from Maven Central (org.mvnpm.at.esbuild:<platform>),
// so neither Node nor the Docker build needs anything new. Build with
// -PminifyStatic=false to ship the source as written (the SBOX_MUTATE harness
// in e2e/tests/buy-journey.anon.spec.js edits served source text).
// ─────────────────────────────────────────────────────────────────────────────
def esbuildVersion = '0.25.10'
def esbuildOs = System.getProperty('os.name').toLowerCase()
def esbuildPlatform = {
    def arch = System.getProperty('os.arch').toLowerCase()
    def cpu = (arch in ['aarch64', 'arm64']) ? 'arm64' : 'x64'
    if (esbuildOs.contains('win')) return "win32-${cpu}"
    if (esbuildOs.contains('mac')) return "darwin-${cpu}"
    return "linux-${cpu}"
}()
def minifyStatic = (findProperty('minifyStatic') ?: 'true').toString() != 'false'

configurations {
    esbuild { transitive = false }
}
dependencies {
    esbuild "org.mvnpm.at.esbuild:${esbuildPlatform}:${esbuildVersion}"
}

def shippedResources = layout.buildDirectory.dir('shipped-resources')
def esbuildDir = layout.buildDirectory.dir('esbuild')

tasks.register('shrinkShippedStatic') {
    group = 'build'
    description = 'Copies the main resources for the boot jar, with static JS and CSS shrunk by esbuild.'
    dependsOn 'processResources'
    def resourcesDir = sourceSets.main.output.resourcesDir
    def esbuildJar = configurations.esbuild
    inputs.dir(resourcesDir)
    inputs.files(esbuildJar)
    inputs.property('minifyStatic', minifyStatic)
    outputs.dir(shippedResources)
    doLast {
        def out = shippedResources.get().asFile
        project.delete(out)
        project.copy { from resourcesDir; into out }
        if (!minifyStatic) return

        def toolDir = esbuildDir.get().asFile
        project.delete(toolDir)
        project.copy {
            from(project.zipTree(esbuildJar.singleFile)) {
                include '**/bin/esbuild', '**/esbuild.exe'
                eachFile { it.path = it.name }
            }
            includeEmptyDirs = false
            into toolDir
        }
        def exe = new File(toolDir, esbuildOs.contains('win') ? 'esbuild.exe' : 'esbuild')
        exe.setExecutable(true)

        def shrink = { String dir, String ext, List<String> flags ->
            def folder = new File(out, dir)
            def files = (folder.listFiles() ?: []).findAll { it.isFile() && it.name.endsWith(ext) }*.absolutePath.sort()
            if (!files) throw new GradleException("shrinkShippedStatic: no ${ext} files in ${folder}")
            def cmd = [exe.absolutePath] + files + flags +
                    ['--outdir=' + folder.absolutePath, '--allow-overwrite', '--log-level=warning']
            def proc = new ProcessBuilder(cmd).redirectErrorStream(true).start()
            def log = proc.inputStream.text
            if (proc.waitFor() != 0) throw new GradleException("esbuild failed on ${dir}:\n${log}")
            if (log.trim()) logger.lifecycle(log.trim())
        }
        shrink('static/js', '.js', ['--minify'])
        shrink('static/css', '.css', ['--minify-whitespace'])
    }
}

tasks.named('bootJar') {
    dependsOn 'shrinkShippedStatic'
    def resourcesDir = sourceSets.main.output.resourcesDir
    classpath = classpath.filter { it != resourcesDir } + files(shippedResources)
}
